<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人工作台 | Personal Dashboard</title>
   <!-- 开启全屏模式，隐藏浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8fafc">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- 头部 -->
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">个人工作台</h1>
                <p class="text-slate-500 mt-1">欢迎回来，今天想完成些什么？</p>
            </div>
            <div class="text-sm font-medium text-slate-400 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100" id="current-date">
            </div>
        </header>

        <!-- 网格布局 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-auto lg:h-[600px]">
            
            <!-- 模块 1: 待办事项 -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col overflow-hidden h-[500px] lg:h-full">
                <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        待办事项
                    </h2>
                </div>
                <div class="p-5 flex-1 flex flex-col min-h-0">
                    <form id="todo-form" class="flex gap-2 mb-4">
                        <input type="text" id="todo-input" placeholder="添加新任务..." class="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm" required>
                        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition-colors font-medium text-sm flex items-center justify-center">添加</button>
                    </form>
                    <ul id="todo-list" class="flex-1 overflow-y-auto space-y-2 pr-2"></ul>
                </div>
            </section>

            <!-- 模块 2: 快速笔记 -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col overflow-hidden h-[500px] lg:h-full">
                <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        快速笔记
                    </h2>
                    <span id="save-status" class="text-xs text-slate-400 transition-opacity duration-300 opacity-0">已保存</span>
                </div>
                <div class="p-5 flex-1 flex flex-col min-h-0">
                    <textarea id="notes-area" class="flex-1 w-full bg-slate-50 border border-slate-200 rounded-xl p-4 resize-none focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all text-sm leading-relaxed" placeholder="在这里输入你的想法，内容会自动云端同步..."></textarea>
                </div>
            </section>

            <!-- 模块 3: 财务理财 -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col overflow-hidden h-[600px] lg:h-full">
                <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        理财记账
                    </h2>
                </div>
                
                <div class="p-5 flex-1 flex flex-col min-h-0">
                    <div class="grid grid-cols-3 gap-3 mb-5">
                        <div class="bg-emerald-50 rounded-xl p-3 text-center border border-emerald-100">
                            <p class="text-xs text-emerald-600 font-medium mb-1">总收入</p>
                            <p class="text-sm font-bold text-emerald-700" id="total-income">¥0.00</p>
                        </div>
                        <div class="bg-rose-50 rounded-xl p-3 text-center border border-rose-100">
                            <p class="text-xs text-rose-600 font-medium mb-1">总支出</p>
                            <p class="text-sm font-bold text-rose-700" id="total-expense">¥0.00</p>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-3 text-center border border-blue-100">
                            <p class="text-xs text-blue-600 font-medium mb-1">净资产</p>
                            <p class="text-sm font-bold text-blue-700" id="net-balance">¥0.00</p>
                        </div>
                    </div>

                    <form id="finance-form" class="space-y-3 mb-5">
                        <div class="flex gap-2">
                            <select id="finance-type" class="w-1/3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="expense">支出</option>
                                <option value="income">收入</option>
                            </select>
                            <input type="number" id="finance-amount" placeholder="金额" step="0.01" min="0.01" class="w-2/3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="finance-desc" placeholder="描述 (如: 晚餐, 工资)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                            <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-xl hover:bg-slate-900 transition-colors font-medium text-sm whitespace-nowrap">记录</button>
                        </div>
                    </form>

                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">近期记录</h3>
                    <ul id="finance-list" class="flex-1 overflow-y-auto space-y-2 pr-2"></ul>
                </div>
            </section>
        </div>
    </div>

    <!-- 升级为云端 Firebase 的核心脚本 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // 注入你的专属秘钥
        const firebaseConfig = {
            apiKey: "AIzaSyAbEEIj-K8q4g_7_dT8wqKAB4LCVB0i9E8",
            authDomain: "zariworkspace-60e41.firebaseapp.com",
            projectId: "zariworkspace-60e41",
            storageBucket: "zariworkspace-60e41.firebasestorage.app",
            messagingSenderId: "606082337084",
            appId: "1:606082337084:web:d1eb4f86698ef46c6df639"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 设置日期
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', dateOptions);

        // ================= 1. 待办事项 =================
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const todosCol = collection(db, 'todos');
        let currentTodos = [];

        onSnapshot(todosCol, (snapshot) => {
            currentTodos = [];
            snapshot.forEach((doc) => currentTodos.push({ id: doc.id, ...doc.data() }));
            currentTodos.sort((a, b) => b.createdAt - a.createdAt); // 最新添加的在上面
            renderTodos();
        });

        function renderTodos() {
            todoList.innerHTML = '';
            if (currentTodos.length === 0) {
                todoList.innerHTML = '<li class="text-center text-slate-400 text-sm py-4">暂无待办事项，今天很轻松！</li>';
                return;
            }
            currentTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `group flex items-center justify-between p-3 rounded-xl border ${todo.done ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200 hover:border-indigo-300'} transition-all`;
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <button onclick="window.toggleTodo('${todo.id}', ${todo.done})" class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${todo.done ? 'bg-indigo-500 border-indigo-500' : 'border-slate-300 hover:border-indigo-400'}">
                            ${todo.done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </button>
                        <span class="text-sm truncate ${todo.done ? 'text-slate-400 line-through' : 'text-slate-700'} cursor-pointer" onclick="window.toggleTodo('${todo.id}', ${todo.done})">${todo.text}</span>
                    </div>
                    <button onclick="window.deleteTodo('${todo.id}')" class="text-slate-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 flex-shrink-0 ml-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                todoList.appendChild(li);
            });
        }

        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (text) {
                todoInput.value = '';
                await setDoc(doc(todosCol, Date.now().toString()), { text, done: false, createdAt: Date.now() });
            }
        });

        window.toggleTodo = async (id, currentStatus) => {
            await updateDoc(doc(db, 'todos', id), { done: !currentStatus });
        };
        window.deleteTodo = async (id) => {
            await deleteDoc(doc(db, 'todos', id));
        };

        // ================= 2. 快速笔记 =================
        const notesArea = document.getElementById('notes-area');
        const saveStatus = document.getElementById('save-status');
        const noteDoc = doc(db, 'notes', 'main');
        let saveTimeout;

        onSnapshot(noteDoc, (docSnap) => {
            if (docSnap.exists() && document.activeElement !== notesArea) {
                notesArea.value = docSnap.data().content || '';
            }
        });

        notesArea.addEventListener('input', () => {
            saveStatus.textContent = '保存中...';
            saveStatus.classList.remove('opacity-0');
            clearTimeout(saveTimeout);
            
            // 停下打字 1 秒后自动同步到云端
            saveTimeout = setTimeout(async () => {
                await setDoc(noteDoc, { content: notesArea.value });
                saveStatus.textContent = '已同步云端';
                setTimeout(() => saveStatus.classList.add('opacity-0'), 2000);
            }, 1000);
        });

        // ================= 3. 财务理财 =================
        const financeForm = document.getElementById('finance-form');
        const financeType = document.getElementById('finance-type');
        const financeAmount = document.getElementById('finance-amount');
        const financeDesc = document.getElementById('finance-desc');
        const financeList = document.getElementById('finance-list');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const netBalanceEl = document.getElementById('net-balance');
        const financeCol = collection(db, 'finance');
        let currentFinance
